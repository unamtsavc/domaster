```html
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Menú</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f1f3f8;
    min-height:100vh;
    padding:30px 15px;
}

.contenedor{
    width:100%;
    max-width:500px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#222;
}

.tarjeta{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
}

.grupo{
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    color:#333;
}

input{
    width:100%;
    height:50px;
    border:2px solid #ddd;
    border-radius:10px;
    padding:0 15px;
    font-size:16px;
    outline:none;
    background:#fff;
    color:#222;
    cursor:default;
}

.estado{
    text-align:center;
    margin-top:15px;
    font-size:14px;
    color:#666;
}

</style>

</head>

<body>

<div class="contenedor">

    <h1>Menú</h1>

    <div class="tarjeta">

        <div class="grupo">

            <label for="producto1">
                Producto 1
            </label>

            <input
                type="text"
                id="producto1"
                readonly
                value=""
            >

        </div>


        <div class="grupo">

            <label for="producto2">
                Producto 2
            </label>

            <input
                type="text"
                id="producto2"
                readonly
                value=""
            >

        </div>


        <div
            class="estado"
            id="estado"
        >
            Conectando con Firebase...
        </div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* CONFIGURACIÓN DE TU FIREBASE */

const firebaseConfig = {

    apiKey:
    "AIzaSyAMgwJFvwsmd2qP5H1SobmciuyOlLNmRU",

    authDomain:
    "menuperros.firebaseapp.com",

    databaseURL:
    "https://menuperros-default-rtdb.firebaseio.com",

    projectId:
    "menuperros",

    storageBucket:
    "menuperros.firebasestorage.app",

    messagingSenderId:
    "387722469718",

    appId:
    "1:387722469718:web:52434bc0dced0ee3a9b6f7"

};


/* INICIAR FIREBASE */

const app =
    initializeApp(firebaseConfig);

const db =
    getDatabase(app);


/* ELEMENTOS */

const producto1 =
    document.getElementById("producto1");

const producto2 =
    document.getElementById("producto2");

const estado =
    document.getElementById("estado");


/* PRODUCTO 1 */

onValue(
    ref(db, "menu/producto1"),

    function(snapshot){

        const valor =
            snapshot.val();

        if(valor !== null){

            producto1.value = valor;

        }else{

            /* SI SE BORRA EN ADMIN,
               TAMBIÉN SE BORRA AQUÍ */

            producto1.value = "";

        }

    },

    function(error){

        console.error(error);

        estado.textContent =
            "Error de conexión con Firebase";

    }
);


/* PRODUCTO 2 */

onValue(
    ref(db, "menu/producto2"),

    function(snapshot){

        const valor =
            snapshot.val();

        if(valor !== null){

            producto2.value = valor;

        }else{

            /* SI SE BORRA EN ADMIN,
               TAMBIÉN SE BORRA AQUÍ */

            producto2.value = "";

        }

        estado.textContent =
            "✓ Menú actualizado en tiempo real";

    },

    function(error){

        console.error(error);

        estado.textContent =
            "Error de conexión con Firebase";

    }
);

</script>

</body>
</html>
